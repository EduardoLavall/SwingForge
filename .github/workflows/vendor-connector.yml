name: Incluir Connector J original para uso offline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor-connector.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  incluir-driver:
    if: github.repository == 'EduardoLavall/SwingForge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar arquivo oficial e confirmar que e identico ao do professor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/jdbc
          curl --fail --location --retry 3 --show-error \
            "https://repo.maven.apache.org/maven2/com/mysql/mysql-connector-j/8.1.0/mysql-connector-j-8.1.0.jar" \
            -o tools/jdbc/mysql-connector-j-8.1.0.jar
          echo "e2e657e9c5ebe06a73485c9739ebd8a18e7bebb852a58d0da287da850beca1c7  tools/jdbc/mysql-connector-j-8.1.0.jar" | sha256sum --check
          unzip -p tools/jdbc/mysql-connector-j-8.1.0.jar LICENSE > tools/jdbc/LICENSE-MySQL-Connector-J.txt
          test -s tools/jdbc/LICENSE-MySQL-Connector-J.txt
      - name: Publicar o driver e licença e retirar esta automação temporária
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/jdbc/mysql-connector-j-8.1.0.jar tools/jdbc/LICENSE-MySQL-Connector-J.txt
          git rm .github/workflows/vendor-connector.yml
          git commit -m "chore: incluir Connector/J 8.1.0 original para uso offline"
          git push origin HEAD:main
